<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESPER // Focus</title>
<style>
:root{color-scheme:dark;--focus:#3dff7a;--short:#ffb000;--long:#ff4d1f;--c:#3dff7a;--on:#000;--err:#ff6a3d;
  --ink:color-mix(in srgb,var(--c) 78%,#fff);--dim:color-mix(in srgb,var(--c) 50%,#000);--line:color-mix(in srgb,var(--c) 38%,#000);--pbg:color-mix(in srgb,var(--c) 4%,#000);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
@font-face{font-family:VT323;src:url(fonts/vt323.woff2) format('woff2');font-display:block}
html{font-size:clamp(18px,3vmin,30px);height:100%}
body{margin:0;height:100%;background:#020403;padding:max(.55rem,env(safe-area-inset-top)) max(.55rem,env(safe-area-inset-right)) max(.55rem,env(safe-area-inset-bottom)) max(.55rem,env(safe-area-inset-left));font-family:VT323,Consolas,ui-monospace,monospace;line-height:1.08;overflow:hidden;color:var(--ink)}
.screen{position:relative;height:100%;display:flex;flex-direction:column;padding:.85rem 1.2rem .8rem;overflow:hidden;border-radius:1.1rem;
  background:radial-gradient(ellipse at 50% 38%,color-mix(in srgb,var(--c) 11%,#000),color-mix(in srgb,var(--c) 3%,#000) 68%,#000);
  box-shadow:inset 0 0 5rem rgba(0,0,0,.8),inset 0 0 .6rem rgba(0,0,0,.9),0 0 2.5rem -.4rem color-mix(in srgb,var(--c) 45%,transparent);
  text-shadow:0 0 .1rem color-mix(in srgb,var(--c) 90%,transparent),0 0 .65rem color-mix(in srgb,var(--c) 42%,transparent),-.05rem 0 rgba(255,40,80,.2),.05rem 0 rgba(40,200,255,.16);
  animation:crton .9s ease-out,flick 7s infinite 1s}
@keyframes crton{0%{transform:scale(1,.004);filter:brightness(6)}40%{transform:scale(1,.06);filter:brightness(3)}100%{transform:none;filter:none}}
@keyframes flick{0%,100%{opacity:1}91%{opacity:1}92%{opacity:.955}93%{opacity:1}97%{opacity:.93}98%{opacity:1}}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.titlebar{display:flex;flex-wrap:nowrap;min-width:0;align-items:center;gap:1rem;padding-bottom:.35rem;border-bottom:3px double var(--line);-webkit-app-region:drag;user-select:none}
.brand{font-size:1.6rem;letter-spacing:.14em;color:var(--c);white-space:nowrap;flex:none}
.brand small{font-size:1rem;letter-spacing:.08em;color:var(--dim);margin-left:.9rem}
#clk{margin-left:auto;color:var(--dim);white-space:nowrap}
.wc{display:none;flex:none;flex-wrap:nowrap;gap:.2rem;-webkit-app-region:no-drag}
body.native .wc{display:flex}
.wc button{background:transparent;border:0;color:var(--dim);padding:0;white-space:nowrap;line-height:1;font-size:.95rem}
.wc button::before{content:"["}.wc button::after{content:"]"}
.wc button:hover,.wc button[aria-pressed=true]{color:var(--c)}
.prog{display:flex;align-items:center;gap:.35rem;margin:.55rem 0 .1rem;color:var(--c);font-size:1.15rem;line-height:1}
.prog .track{flex:1;height:.5rem;position:relative;background:color-mix(in srgb,var(--c) 13%,#000)}
.prog .track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);box-shadow:0 0 .6rem var(--c);transition:width .3s linear}
.prog b{font-weight:400;min-width:3.4ch;text-align:right}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.4rem 0 .55rem}
.modes button{background:transparent;color:var(--dim);border:1px solid var(--line);padding:.05rem 0;white-space:nowrap;font-size:1.05rem}
.modes button::before{content:"[ "}.modes button::after{content:" ]"}
.modes button:hover{color:var(--ink);border-color:var(--dim)}
.modes button[aria-pressed=true],.ctrl .go,.seg button[aria-pressed=true],.cfg .save{background:var(--c);color:var(--on);border-color:var(--c);text-shadow:none;box-shadow:0 0 1rem color-mix(in srgb,var(--c) 70%,transparent)}
.main{flex:1;min-height:0;display:flex;gap:1rem}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.log{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;font-size:1.05rem;line-height:1.15;color:var(--dim);padding-top:.2rem;-webkit-mask:linear-gradient(transparent,#000 10%);mask:linear-gradient(transparent,#000 10%)}
.log::-webkit-scrollbar{display:none}
.log div{white-space:pre-wrap;word-break:break-word}
.log .banner{font-family:Consolas,"Lucida Console",ui-monospace,monospace;font-size:.78rem;line-height:1;color:var(--c);white-space:pre}
.log .chat{color:var(--ink)}.log .chat b{font-weight:400}
.log .cmd,.log .tk{color:var(--ink)}.log .ok{color:var(--c)}.log .err{color:var(--err)}
.log .tk em{font-style:normal;color:var(--dim)}.log .tk b{font-weight:400;color:var(--c)}
.log .typing::after{content:"\2588";color:var(--c)}
.log.on{animation:crton .45s ease-out 1}
.prompt{display:flex;align-items:center;gap:.6rem;margin-top:.35rem;font-size:1.1rem;cursor:text}
.prompt span{color:var(--c);white-space:nowrap}
.prompt input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;caret-color:var(--c);caret-shape:block;padding:0;text-shadow:inherit}
.prompt input::placeholder{color:var(--line)}
.ctrl{display:grid;grid-template-columns:1fr 2fr 1fr 1fr;gap:.45rem;margin-top:.6rem}
.ctrl button,.cfg button{color:var(--c);background:transparent;border:1px solid var(--line);padding:.1rem 0;font-size:1.15rem;white-space:nowrap}
.ctrl button::before{content:"[ "}.ctrl button::after{content:" ]"}
.ctrl button:hover,.cfg button:hover{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:var(--c)}
.ctrl .go:hover,.cfg .save:hover{background:var(--c);filter:brightness(1.12)}
button:active{transform:translateY(1px)}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.1rem 1rem;margin-top:.6rem;padding:0 .6rem;background:var(--c);color:var(--on);font-size:1.05rem;text-shadow:none;box-shadow:0 0 1.2rem -.2rem var(--c)}
@media(pointer:coarse){html{font-size:clamp(19px,4.8vw,27px)}.modes button,.ctrl button{padding:.42rem 0}.cfg button{padding:.4rem 0}.seg button{padding:.25rem .65rem!important}.cfg input[type=range]{width:6.2rem}}
@media(max-width:700px){.brand small{display:none}.brand{font-size:1.3rem;letter-spacing:.08em}.titlebar{gap:.6rem}.wc button{font-size:.85rem}.bar{padding:0 .5rem}}
@media(max-width:520px){#clk{display:none}}
.log .ascii{white-space:pre;font-family:Consolas,"Lucida Console",ui-monospace,monospace;font-size:.8rem;line-height:1.05}
.log .typing-ind{opacity:.85}
.vec{margin:.45rem 0;aspect-ratio:480/300;background:#000;border:1px solid var(--line);animation:crton .45s ease-out}
.vec svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 2px var(--c)) drop-shadow(1px 0 0 rgba(255,40,80,.5)) drop-shadow(-1px 0 0 rgba(40,200,255,.42))}
.vec .p{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:square;stroke-dasharray:1;stroke-dashoffset:1;animation:vdraw var(--t,.6s) cubic-bezier(.3,.6,.3,1) var(--d,0s) forwards}
.vec .p.hi{stroke:var(--c);stroke-width:2.2}
.vec .p.dash{stroke-dasharray:5 4;stroke-dashoffset:0;opacity:0;animation:vfade .6s ease var(--d,0s) forwards}
.vec text{white-space:pre;font-family:VT323,Consolas,monospace;fill:var(--ink);paint-order:stroke;stroke:#000;stroke-width:3px;text-shadow:none}
.vec .cursor path{fill:none;stroke:#ff7a7a;stroke-width:1.1;opacity:.85}
.vec .sw{fill:none;stroke:var(--c);stroke-width:1.6}.vec .sw.f1{opacity:.4}.vec .sw.f2{opacity:.2}
.vec .sweep{transform-box:view-box;transform-origin:175px 168px;animation:vsweep 3s linear 1.6s infinite}
.vec .fb{fill:var(--c);animation:fbfill 4s steps(24) 1.6s forwards}
.vec.static .p{stroke-dashoffset:0;animation:none}.vec.static .p.dash{opacity:1;animation:none}.vec.static .fb{width:192px;animation:none}
@keyframes vdraw{to{stroke-dashoffset:0}}
@keyframes vfade{to{opacity:1}}
@keyframes vsweep{to{transform:rotate(360deg)}}
@keyframes fbfill{to{width:192px}}
.boot{position:absolute;inset:0;z-index:8;display:none;background:#000;padding:1rem 1.2rem;overflow:hidden}
.boot.on{display:block}
.boot pre{margin:0;font:inherit;font-size:1.05rem;line-height:1.15;color:var(--ink);white-space:pre-wrap}
.boot .skip{position:absolute;right:1.2rem;bottom:.7rem;color:var(--dim);font-size:.9rem}
.screen.off{animation:croff .6s ease-in forwards}
@keyframes croff{0%{transform:none;filter:none;opacity:1}55%{transform:scale(1,.012);filter:brightness(4);opacity:1}100%{transform:scale(0,.004);filter:brightness(6);opacity:0}}
.only-native{display:none!important}body.native .only-native{display:flex!important}
/* config */
.cfg{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;overflow-y:auto;padding:.85rem 1.2rem;background:color-mix(in srgb,var(--c) 3%,#000)}
.cfg.open{display:flex;animation:crton .35s ease-out 1}
.cfg .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--line);padding-bottom:.35rem;color:var(--c)}
.cfg .head .t{font-size:1.6rem;letter-spacing:.14em}.cfg .head .s{color:var(--dim)}
.cfg pre{margin:.5rem 0 0;font:inherit;font-size:1rem;color:var(--dim)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 2.2rem}
@media(max-width:760px){.cgrid{grid-template-columns:1fr}}
.cfg .row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:1.15rem;margin-top:.55rem;color:var(--ink)}
.cfg .row .k{color:var(--c)}
.cfg .fill{flex:1;border-bottom:1px dotted var(--line);height:1px;align-self:flex-end;margin-bottom:.3rem}
.cfg input{background:transparent;border:0;border-bottom:1px solid var(--c);color:var(--c);font:inherit;font-size:1.3rem;outline:0;padding:0 .1rem;text-shadow:inherit}
.cfg input[type=number]{width:3.6ch;text-align:right;-moz-appearance:textfield;appearance:textfield}
.cfg input[type=number]::-webkit-outer-spin-button,.cfg input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cfg input:focus{background:color-mix(in srgb,var(--c) 14%,transparent)}
.cfg input[type=range]{-webkit-appearance:none;appearance:none;width:5.4rem;height:1rem;border:0;padding:0;cursor:pointer}
.cfg input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
.cfg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:.5rem;height:.9rem;margin-top:-.4rem;background:var(--c);border:0;border-radius:0;box-shadow:0 0 .5rem var(--c)}
.cfg input[type=range]::-moz-range-track{height:2px;background:var(--line)}
.cfg input[type=range]::-moz-range-thumb{width:.5rem;height:.9rem;background:var(--c);border:0;border-radius:0}
.cfg output{width:3.6ch;text-align:right;color:var(--c)}
.seg{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.25rem}
.seg button{min-width:2.2rem;padding:0 .4rem!important;font-size:1.1rem!important}
.sw{display:flex;gap:.7rem}
.sw label{display:flex;flex-direction:column;align-items:center;font-size:.8rem;color:var(--dim)}.sw i{font-style:normal}
.sw input{width:2.1rem;height:1.2rem;padding:0;border:1px solid var(--c);cursor:pointer}
.sw input::-webkit-color-swatch-wrapper{padding:2px}.sw input::-webkit-color-swatch{border:0}
.cfg .msg{min-height:1.1em;margin-top:.5rem;color:var(--err)}
.cfg .acts{position:sticky;bottom:0;margin-top:auto;padding:.6rem 0 .1rem;background:color-mix(in srgb,var(--c) 3%,#000);display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
/* crt overlay */
.fx{position:absolute;inset:0;pointer-events:none;z-index:9;text-shadow:none}
.fx i{position:absolute;inset:0}
.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px)}
.roll{height:24%!important;background:linear-gradient(transparent,color-mix(in srgb,var(--c) 7%,transparent),transparent);animation:roll 8s linear infinite}
@keyframes roll{from{top:-28%}to{top:112%}}
.glare{background:linear-gradient(128deg,rgba(255,255,255,.07),transparent 26%)}
.vig{background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.62))}
.grain{inset:-50%!important;opacity:.07;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:gr .6s steps(3) infinite}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.vec .p{stroke-dashoffset:0!important}.vec .p.dash{opacity:1!important}.vec .fb{width:192px}}
</style>
</head>
<body>
<main class="screen" id="app">
  <header class="titlebar"><span class="brand">ESPER//FOCUS<small>interface 2019</small></span><span id="clk"></span>
    <span class="wc"><button id="w-pin" aria-pressed="false">pin</button><button id="w-min">min</button><button id="w-max">full</button><button id="w-x">x</button></span></header>
  <div class="prog" aria-hidden="true"><span>[</span><div class="track"><i id="b-fill"></i></div><span>]</span><b id="b-pct">0%</b></div>
  <div class="modes" role="group" aria-label="Timer mode">
    <button data-m="focus" aria-pressed="true"></button><button data-m="short" aria-pressed="false"></button><button data-m="long" aria-pressed="false"></button>
  </div>
  <div class="main">
    <section class="col">
      <div class="log" id="log" aria-live="polite"></div>
      <label class="prompt" for="cmd"><span>operator@esper:~$</span><input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type help" aria-label="Command line"></label>
      <div class="ctrl"><button id="reset">reset</button><button id="go" class="go">start</button><button id="skip">skip</button><button id="conf">config</button></div>
    </section>
      </div>
  <div class="bar"><span id="b-mode"></span><span id="b-time"></span><span id="b-state"></span><span id="b-cyc"></span></div>

  <form class="cfg" id="cfg" autocomplete="off">
    <div class="head"><span class="t">CONFIG</span><span class="s">/etc/esper.conf</span></div>
    <pre># durations in minutes (1-180) | speeds: slow, medium, fast (randomized) | volumes 0-100</pre>
    <div class="cgrid">
      <div>
        <label class="row"><span class="k">window_opacity</span><span class="fill"></span><input type="range" id="v-opa" min="30" max="100" step="5" aria-label="Window opacity"><output id="vo-opa" for="v-opa"></output></label>
        <label class="row"><span class="k">focus_min</span><span class="fill"></span><input id="o-focus" type="number" inputmode="numeric" min="1" max="180"></label><label class="row"><span class="k">short_break_min</span><span class="fill"></span><input id="o-short" type="number" inputmode="numeric" min="1" max="180"></label><label class="row"><span class="k">long_break_min</span><span class="fill"></span><input id="o-long" type="number" inputmode="numeric" min="1" max="180"></label>
        <div class="row"><span class="k">timer_log</span><span class="fill"></span><span class="seg" id="o-log" role="group" aria-label="Timer log speed"><button type="button" data-v="slow">slow</button><button type="button" data-v="medium">medium</button><button type="button" data-v="fast">fast</button></span></div>
        <div class="row"><span class="k">ambient_play</span><span class="fill"></span><span class="seg" id="o-amb" role="group" aria-label="Ambient playback"><button type="button" data-v="running">running</button><button type="button" data-v="always">always</button></span></div>
        <div class="row"><span class="k">random_cmds</span><span class="fill"></span><span class="seg" id="o-chat" role="group" aria-label="Random shell commands"><button type="button" data-v="off">off</button><button type="button" data-v="slow">slow</button><button type="button" data-v="medium">medium</button><button type="button" data-v="fast">fast</button></span></div>
        <div class="row"><span class="k">crew_chat</span><span class="fill"></span><span class="seg" id="o-crew" role="group" aria-label="Crew chat"><button type="button" data-v="off">off</button><button type="button" data-v="slow">slow</button><button type="button" data-v="medium">medium</button><button type="button" data-v="fast">fast</button></span></div>
        <div class="row"><span class="k">scope_displays</span><span class="fill"></span><span class="seg" id="o-vis" role="group" aria-label="Scope displays"><button type="button" data-v="off">off</button><button type="button" data-v="slow">slow</button><button type="button" data-v="medium">medium</button><button type="button" data-v="fast">fast</button></span></div>
        <div class="row"><span class="k">boot_sequence</span><span class="fill"></span><span class="seg" id="o-boot" role="group" aria-label="Boot and shutdown sequence"><button type="button" data-v="on">on</button><button type="button" data-v="off">off</button></span></div>
        <div class="row"><span class="k">accent_color</span><span class="fill"></span><span class="sw"><label><input type="color" id="c-focus" aria-label="Focus color"><i>focus</i></label><label><input type="color" id="c-short" aria-label="Short break color"><i>short</i></label><label><input type="color" id="c-long" aria-label="Long break color"><i>long</i></label></span></div>
      </div>
      <div>
        <label class="row"><span class="k">vol_ambient</span><span class="fill"></span><input type="range" id="v-amb" min="0" max="100" step="5" aria-label="Ambient volume"><output id="vo-amb" for="v-amb"></output></label><label class="row"><span class="k">vol_chime</span><span class="fill"></span><input type="range" id="v-chime" min="0" max="100" step="5" aria-label="Chime volume"><output id="vo-chime" for="v-chime"></output></label>
      </div>
    </div>
    <div class="msg" id="msg" role="alert"></div>
    <div class="acts"><button type="submit" class="save">save</button><button type="button" id="defs">defaults</button><button type="button" id="cancel">cancel</button></div>
  </form>
  <div class="boot" id="boot" aria-hidden="true"><pre id="boot-t"></pre><div class="skip">press any key to skip</div></div>
  <div class="fx"><i class="scan"></i><i class="roll"></i><i class="glare"></i><i class="vig"></i><i class="grain"></i></div>
</main>
<script src="sfx.js"></script>
<script>

(function(){
  var still=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* state */
  var VK=['chime','amb'],DEF={focus:25,short:5,long:15},dur={focus:25,short:5,long:15},SP={log:'medium',cmd:'medium',crew:'medium',vec:'medium'},COL={focus:'#3dff7a',short:'#ffb000',long:'#ff4d1f'},DEFCOL={focus:'#3dff7a',short:'#ffb000',long:'#ff4d1f'},vol={chime:.7,amb:.5},DEFVOL={chime:.7,amb:.5},muted=false,ambMode='running',chatter=true,crewOn=true,visualsOn=true,bootOn=true,opac=100;
  try{var s=JSON.parse(localStorage.getItem('esper.dur'));if(s){['focus','short','long'].forEach(function(k){var n=parseInt(s[k],10);if(n>=1&&n<=180)dur[k]=n});if(s.colors)['focus','short','long'].forEach(function(k){if(/^#[0-9a-f]{6}$/i.test(s.colors[k]))COL[k]=s.colors[k]});if(s.vol)VK.forEach(function(k){var n=Number(s.vol[k]);if(n>=0&&n<=1)vol[k]=n});muted=!!s.muted;if(s.ambMode==='always')ambMode='always';if(s.speeds){if(['slow','medium','fast'].indexOf(s.speeds.log)>-1)SP.log=s.speeds.log;['cmd','crew','vec'].forEach(function(k){if(['off','slow','medium','fast'].indexOf(s.speeds[k])>-1)SP[k]=s.speeds[k]})}else{if(s.interval===5)SP.log='fast';if(s.interval===20||s.interval===30)SP.log='slow';if(s.chatter===false)SP.cmd='off';if(s.crew===false)SP.crew='off';if(s.visuals===false)SP.vec='off'}chatter=SP.cmd!=='off';crewOn=SP.crew!=='off';visualsOn=SP.vec!=='off';if(s.boot===false)bootOn=false;var op0=parseInt(s.opacity,10);if(op0>=30&&op0<=100)opac=op0}}catch(e){}
  var META={focus:{c:'--focus',run:'subject locked in',idle:'standing by',tag:'FOCUS'},
            short:{c:'--short',run:'cooling down',idle:'break queued',tag:'SHORT_BREAK'},
            long:{c:'--long',run:'full recharge',idle:'long break queued',tag:'LONG_BREAK'}};
  var $=function(i){return document.getElementById(i)};
  var root=document.documentElement,goBtn=$('go'),app=$('app'),logEl=$('log'),cmd=$('cmd'),cfg=$('cfg'),
      modeBtns=[].slice.call(document.querySelectorAll('.modes button'));
    var lastN=0,lastBase='',mode='focus',total=1500,left=1500,running=false,end=0,tick=null,done=0,ac=null,hist=[],hi=0;

  function lum(h){return (0.299*parseInt(h.substr(1,2),16)+0.587*parseInt(h.substr(3,2),16)+0.114*parseInt(h.substr(5,2),16))/255}
  function applyColors(){['focus','short','long'].forEach(function(k){root.style.setProperty('--'+k,COL[k])});root.style.setProperty('--on',lum(COL[mode])>.55?'#000':'#fff')}

  ['focus','short','long'].forEach(function(k){$('c-'+k).addEventListener('input',function(){prev(k)})});
  function pad(n){return (n<10?'0':'')+n}
  function fmt(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
  function stamp(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
  var Q=[],busy=false;
  function out(t,cls,instant){enqueue({cls:cls,parts:[{t:t}],instant:instant})}
  function enqueue(it){Q.push(it);if(!busy)pump()}

    if(ambTarget===0&&ambFade<.01){ambA.forEach(function(a){a.pause()});ambEnv=[0,0];ambDir=[0,0];clearInterval(ambTimer);ambTimer=null}
  }
  function ambStart(){
    ambTarget=1;
    if(ambA[0].paused&&ambA[1].paused){
      var cur=ambA[ambCur];ambEnv=[0,0];ambEnv[ambCur]=1;ambDir=[0,0];
      var seek=function(){if(isFinite(cur.duration)&&cur.duration>40)cur.currentTime=Math.random()*(cur.duration-AXF*3)};
      if(cur.readyState>0)seek();else cur.addEventListener('loadedmetadata',seek,{once:true});
      ambPlay(ambCur);
    }
    if(!ambTimer)ambTimer=setInterval(ambTick,100);
  }
  function ambStop(){ambTarget=0;if(!ambTimer)ambTimer=setInterval(ambTick,100)}
  function ambSync(){var want=(ambMode==='always'||running||ambPrev)&&ambLvl>0;want?ambStart():ambStop()}
  function ambSet(){ambVolumes();ambSync()}
  function chime(){
    initAudio();if(!ac)return;
    if(sfx.chime.length){var cs=ac.createBufferSource();cs.buffer=sfx.chime[0];cs.connect(gChime);cs.start();return}
    [196,196,147].forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.4;o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
      o.connect(g);g.connect(gChime);o.start(t);o.stop(t+1.25)});
  }
  function preview(k){
    initAudio();if(k==='amb'){ambPrev=true;ambSync();clearTimeout(ambPT);ambPT=setTimeout(function(){ambPrev=false;ambSync()},3500);return}
    chime();
  }
  function toggle(){initAudio();
    running?pause():start()}

  /* durations */
  function save(){try{localStorage.setItem('esper.dur',JSON.stringify({focus:dur.focus,short:dur.short,long:dur.long,speeds:SP,colors:COL,vol:vol,muted:muted,ambMode:ambMode,chatter:chatter,crew:crewOn,visuals:visualsOn,boot:bootOn,opacity:opac}))}catch(e){}}
  function setSp(k,v){SP[k]=v;chatter=SP.cmd!=='off';crewOn=SP.crew!=='off';visualsOn=SP.vec!=='off';save();fakeSync()}
  function setDur(m,n){
    dur[m]=n;save();
    if(m===mode&&!running&&left===total){total=left=n*60;sys(m+'_min='+n+'  applied','ok')}
    else sys(m+'_min='+n+'  (applies next '+m+' phase)','ok');
    render();
  }
  function parseMin(v){var n=Number(v);return (v!==''&&isFinite(n)&&n>=1&&n<=180&&Math.floor(n)===n)?n:null}
  function volTxt(k){$('vo-'+k).textContent=Math.round($('v-'+k).value)+'%'}
  VK.forEach(function(k){var el=$('v-'+k);
    el.addEventListener('input',function(){volTxt(k);setBus(k,el.value/100)});
    el.addEventListener('change',function(){preview(k)})});
  var pendAmb='running';function segAmb(v){pendAmb=v;[].slice.call(document.querySelectorAll('#o-amb button')).forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===v))})}
  [].slice.call(document.querySelectorAll('#o-amb button')).forEach(function(b){b.onclick=function(){segAmb(b.dataset.v)}});
  function bindSeg(id,pick){var bs=[].slice.call(document.querySelectorAll('#'+id+' button'));function mark(v){bs.forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.v===v))})}bs.forEach(function(b){b.onclick=function(){pick(b.dataset.v);mark(b.dataset.v)}});return mark}
  var pendBoot='on',markBoot=bindSeg('o-boot',function(v){pendBoot=v}),pendSp={log:'medium',cmd:'medium',crew:'medium',vec:'medium'},markSp={};
  [['log','o-log'],['cmd','o-chat'],['crew','o-crew'],['vec','o-vis']].forEach(function(q){markSp[q[0]]=bindSeg(q[1],function(v){pendSp[q[0]]=v})});
  function applyOpacity(p){try{if(window.esper&&esper.opacity)esper.opacity(p/100)}catch(e){}}
  var opaEl=$('v-opa'),opaOK=!!(window.esper&&esper.opacity);if(opaEl&&!opaOK)opaEl.disabled=true;
  if(opaEl)opaEl.addEventListener('input',function(){$('vo-opa').textContent=opaEl.value+'%';applyOpacity(+opaEl.value)});
  function openCfg(){['focus','short','long'].forEach(function(k){$('o-'+k).value=dur[k];$('c-'+k).value=COL[k]});VK.forEach(function(k){$('v-'+k).value=Math.round(vol[k]*100);volTxt(k)});segAmb(ambMode);['log','cmd','crew','vec'].forEach(function(k){pendSp[k]=SP[k];markSp[k](SP[k])});pendBoot=bootOn?'on':'off';markBoot(pendBoot);if(opaEl){opaEl.value=opac;$('vo-opa').textContent=opaOK?opac+'%':'n/a'}$('msg').textContent='';cfg.classList.add('open');$('o-focus').focus();$('o-focus').select()}
  function closeCfg(){cfg.classList.remove('open');applyColors();applyVol();applyOpacity(opac);if(document.activeElement)document.activeElement.blur()}
  cfg.onsubmit=function(e){e.preventDefault();var v={};
    for(var k of ['focus','short','long']){v[k]=parseMin($('o-'+k).value);if(v[k]===null){$('msg').textContent='error: '+k+'_min must be a whole number, 1-180';$('o-'+k).focus();return}}
    ['focus','short','long'].forEach(function(k){if(v[k]!==dur[k])setDur(k,v[k])});['focus','short','long'].forEach(function(k){COL[k]=$('c-'+k).value});VK.forEach(function(k){vol[k]=$('v-'+k).value/100});if(pendAmb!==ambMode)ambMode=pendAmb;['log','cmd','crew','vec'].forEach(function(k){SP[k]=pendSp[k]});chatter=SP.cmd!=='off';crewOn=SP.crew!=='off';visualsOn=SP.vec!=='off';bootOn=pendBoot==='on';if(opaEl)opac=+opaEl.value;save();closeCfg();ambSync();fakeSync();sys('config saved','ok')};
  $('cancel').onclick=closeCfg;
  $('defs').onclick=function(){['focus','short','long'].forEach(function(k){$('o-'+k).value=DEF[k];$('c-'+k).value=DEFCOL[k];prev(k)});VK.forEach(function(k){$('v-'+k).value=Math.round(DEFVOL[k]*100);volTxt(k);setBus(k,DEFVOL[k])});segAmb('running');['log','cmd','crew','vec'].forEach(function(k){pendSp[k]='medium';markSp[k]('medium')});pendBoot='on';markBoot('on');if(opaEl){opaEl.value=100;$('vo-opa').textContent='100%';applyOpacity(100)}$('msg').textContent=''};
  $('conf').onclick=function(){sys('opening /etc/esper.conf');openCfg()};

  /* commands */
  var HELP=['start | pause | reset | skip','focus | short | long      switch mode','set <mode> <min>         e.g. set focus 50','set log <slow|medium|fast>  how often timer lines print','set color <mode> <#hex>   e.g. set color focus #00ff9c','set volume <chime|ambient> <0-100>','set ambient <running|always>  when the ambience plays','set chatter <off|slow|medium|fast>  random shell commands','set crew <off|slow|medium|fast>     crew chat','show [scan|trace|radar|plan|orbit|route|intercept|grid|telemetry]','set visuals <off|slow|medium|fast>  scope displays','set boot <on|off>           boot and shutdown sequence','set opacity <30-100>       window transparency (desktop)','mute | unmute','config                   edit all durations','status | clear | help'];
  function run(line){
    var p=line.trim().toLowerCase().split(/\s+/),c=p[0];if(!c)return;
    out('operator@esper:~$ '+line.trim(),'cmd',true);hist.push(line);hi=hist.length;
    if(c==='start'||c==='go'||c==='resume'){running?sys('timer already running','err'):start()}
    else if(c==='pause'||c==='stop'||c==='hold')pause();
    else if(c==='reset'){setMode(mode)}
    else if(c==='skip'||c==='next'){sys('phase skipped');next();crewReact('skip')}
    else if(META[c])setMode(c);
    else if(c==='mode'&&META[p[1]])setMode(p[1]);
    else if(c==='set'){var m=p[1],n=parseMin(p[2]);
      if(m==='volume'){var vm={chime:'chime',ambient:'amb'}[p[2]],vn=Number(p[3]);
        if(vm&&p[3]!==undefined&&isFinite(vn)&&vn>=0&&vn<=100){vol[vm]=vn/100;save();applyVol();initAudio();sys('vol_'+p[2]+'='+Math.round(vn)+'%','ok')}else out('usage: set volume <chime|ambient> <0-100>','err')}
      else if(m==='color'){var cm=p[2],hx=(p[3]||'').replace('#','');if(META[cm]&&/^[0-9a-f]{6}$/.test(hx)){COL[cm]='#'+hx;save();applyColors();sys('color_'+cm+'=#'+hx,'ok')}else out('usage: set color <mode> <#rrggbb>','err')}
      else if(m==='ambient'){if(p[2]==='running'||p[2]==='always'){ambMode=p[2];save();ambSync();sys('ambient_play='+p[2],'ok')}else out('usage: set ambient <running|always>','err')}
      else if(m==='opacity'){var op=parseInt(p[2],10);if(!opaOK){out('opacity needs the desktop app (replace main.js and preload.js too)','err')}else if(op>=30&&op<=100){opac=op;save();applyOpacity(op);sys('window_opacity='+op+'%','ok')}else out('usage: set opacity <30-100>','err')}
      else if(m==='log'||m==='chatter'||m==='crew'||m==='visuals'){var key={log:'log',chatter:'cmd',crew:'crew',visuals:'vec'}[m],val=p[2]==='on'?'medium':p[2],opts=key==='log'?['slow','medium','fast']:['off','slow','medium','fast'];if(opts.indexOf(val)>-1){setSp(key,val);sys(m+'='+val,'ok')}else out('usage: set '+m+' <'+opts.join('|')+'>','err')}
      else if(m==='boot'){if(p[2]==='on'||p[2]==='off'){bootOn=p[2]==='on';save();sys('boot='+p[2],'ok')}else out('usage: set boot <on|off>','err')}


      else if(m==='interval'){var mp={5:'fast',10:'medium',20:'slow',30:'slow'}[n];if(mp){setSp('log',mp);sys('log='+mp+' (intervals are now slow/medium/fast)','ok')}else out('usage: set log <slow|medium|fast>','err')}
      else if(!META[m]||n===null)out('usage: set <focus|short|long> <1-180>  |  set log <slow|medium|fast>','err');else setDur(m,n)}
    else if(c==='show'||VEC_ALIAS[c]){
      var vt=VEC_ALIAS[c]||VEC_ALIAS[p[1]]||(VEC_NAMES.indexOf(p[1])>-1?p[1]:null);
      if(c==='show'&&p[1]==='list')out('displays: '+Object.keys(VEC_ALIAS).join(', '));
      else if(c==='show'&&p[1]&&!vt)out('usage: show [scan|trace|radar|plan|orbit|route|intercept|grid|telemetry]','err');
      else showVec(vt,false);
    }
    else if(c==='mute'||c==='unmute'){muted=c==='mute';save();initAudio();applyVol();sys(muted?'audio muted':'audio on','ok')}
    else if(c==='config'||c==='options'||c==='conf')openCfg();
    else if(c==='status'){out('mode='+META[mode].tag+'  remaining='+fmt(Math.ceil(left))+'  '+(running?'running':'idle'));
      out('focus='+dur.focus+'m  short='+dur.short+'m  long='+dur.long+'m  log='+SP.log+' cmds='+SP.cmd+' crew='+SP.crew+' scopes='+SP.vec+'  sessions='+done)}
    else if(c==='clear'){clearLog()}
    else if(c==='help'||c==='?'){HELP.forEach(function(h){out(h)})}
    else if(!chatReply(line.trim()))out('esper: command not found: '+c+'  (try help)','err');
  }
  cmd.addEventListener('keydown',function(e){
    if(e.key==='Enter'){var v=cmd.value;cmd.value='';run(v)}
    else if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);cmd.value=hist[hi]||''}
    else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);cmd.value=hist[hi]||''}
  });
  logEl.onclick=function(){if(window.matchMedia('(pointer:fine)').matches)cmd.focus()};

  goBtn.onclick=toggle;$('reset').onclick=function(){setMode(mode)};$('skip').onclick=function(){sys('phase skipped');next();crewReact('skip')};
  modeBtns.forEach(function(b){b.onclick=function(){setMode(b.dataset.m)}});
  document.addEventListener('keydown',function(e){
    var t=e.target.tagName;
    if(e.key==='Escape'&&cfg.classList.contains('open')){closeCfg();return}
    if(t==='INPUT'||t==='BUTTON')return;
    if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='/'){e.preventDefault();cmd.focus()}
  });

  function clk(){$('clk').textContent=stamp()}setInterval(clk,1000);clk();

  /* desktop shell hooks */
  if(window.esper){
    document.body.classList.add('native');
    $('w-min').onclick=function(){esper.win('min')};$('w-max').onclick=function(){esper.win('full')};$('w-x').onclick=function(){esper.win('close')};
    $('w-pin').onclick=function(){esper.win('pin').then(function(on){$('w-pin').setAttribute('aria-pressed',String(!!on));sys(on?'window pinned on top':'window unpinned')})};
    esper.onToggle(function(){toggle()});if(esper.onShutdown)esper.onShutdown(shutdown);applyOpacity(opac);
  }

  /* ---- boot / shutdown sequences ---- */
  var BOOT=['ESPER SYSTEMS  BIOS v2.019','(C) 1984 ESPER SYSTEMS','','CPU: ESPER-8800 @ 4.77MHZ .......... OK','MEMORY TEST: 640K .................. OK','VIDEO: PHOSPHOR RGB ............... OK','MOUNTING /DEV/TIMER ............... OK','MOUNTING /DEV/AMBIENT ............. OK','LOADING CREW ROSTER ............... 7 OPERATORS','LINKING COMMS ..................... BASE ONLINE','@bar','','READY.'];
  var SHUT=['SAVING STATE ................... OK','UNMOUNTING /DEV/AMBIENT ........ OK','SIGNING OFF CREW ............... OK','','POWER DOWN.'];
  var seqRun=0,shuttingDown=false;
  function seq(lines,done){
    var el=$('boot-t'),box=$('boot'),id=++seqRun,i=0,fin=false;
    el.textContent='';box.classList.add('on');
    function end(){if(fin)return;fin=true;document.removeEventListener('keydown',end,true);box.removeEventListener('pointerdown',end);box.classList.remove('on');if(done)done()}
    document.addEventListener('keydown',end,true);box.addEventListener('pointerdown',end);
    function nextLine(){
      if(fin||id!==seqRun)return;
      if(i>=lines.length){setTimeout(end,350);return}
      var ln=lines[i++],base=el.textContent,n=0,iv;
      if(ln==='@bar'){
        iv=setInterval(function(){if(fin){clearInterval(iv);return}n++;el.textContent=base+'['+'\u2588'.repeat(n)+'\u2591'.repeat(18-n)+'] '+Math.round(n/18*100)+'%\n';if(n>=18){clearInterval(iv);setTimeout(nextLine,120)}},34);
        return;
      }
      iv=setInterval(function(){if(fin){clearInterval(iv);return}n++;el.textContent=base+ln.slice(0,n);if(n>=ln.length){clearInterval(iv);el.textContent=base+ln+'\n';setTimeout(nextLine,40+kR(110))}},11);
    }
    nextLine();
  }
  function shutdown(){
    if(shuttingDown)return;shuttingDown=true;
    var quit=function(){try{esper.quit()}catch(e){}};
    if(!bootOn||still){quit();return}
    seq(SHUT,function(){$('app').classList.add('off');setTimeout(quit,650)});
  }
  function replayScreen(){var sc=$('app');sc.style.animation='none';void sc.offsetWidth;sc.style.animation=''}

  /* boot */
  var BAN=["██████  ██████  ██████  ██████  ██████", "██      ██      ██  ██  ██      ██  ██", "█████   ██████  ██████  █████   ██████", "██          ██  ██      ██      ██ ██ ", "██████  ██████  ██      ██████  ██  ██"];
  var boot=['esper interface 2019 ... ready for inquiry','mounting /dev/timer ... ok','loading /etc/esper.conf ... ok','ambient bus ... online','type help for commands'];
  applyVol();setMode('focus',true);
  function logBoot(){BAN.forEach(function(l){out(l,'banner',true)});boot.forEach(function(l,i){out(l,i===boot.length-1?'ok':'')})}
  if(bootOn&&!still)seq(BOOT,function(){replayScreen();logBoot()});else logBoot();
})();
</script>
